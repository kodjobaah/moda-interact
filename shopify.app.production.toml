# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e63ccadf786dd6b35c69b7fcfb909258"
name = "Moda Interact Production"
application_url = "https://app.modainteract.com"
embedded = true

[access_scopes]
scopes = "write_app_proxy,read_customers,read_discounts,read_legal_policies,read_locales,read_markets,read_orders,read_products"
optional_scopes = []
use_legacy_install_flow = false

[app_proxy]
url = "/shopify/consent"
prefix = "apps"
subpath = "moda-consent"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [
  "carts/create",
  "checkouts/create",
  "checkouts/update",
  "discounts/delete",
  "discounts/redeemcode_added",
  "orders/create",
  "carts/update",
  "discounts/create",
  "discounts/update",
  "discounts/redeemcode_removed"
]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [
  "https://app.modainteract.com",
  "https://app.modainteract.com/auth/callback",
  "https://app.modainteract.com/auth/shopify/callback"
]
